<!doctype html>
<html lang="en" class="is-loading">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Guillaume — Interactive developer</title>
<meta name="description" content="Guillaume, independent interactive developer. Selected work and contact.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,200..500&display=swap" rel="stylesheet">
<style>
:root{
  --fg:#EDEAE4;
  --fg-soft:rgba(237,234,228,.56);
  --bg:#09080b;
  --dusk:#2a1a2b;
  --ember:#c9764f;
  --ease:cubic-bezier(.16,1,.3,1);
  --pad:clamp(1.25rem,3.1vw,3rem);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
/* The scene is always dusk: both themes share the same tokens on purpose */
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --fg:#EDEAE4; --bg:#09080b; } }
:root[data-theme="dark"]{ --fg:#EDEAE4; --bg:#09080b; }
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
html.lenis,html.lenis body{height:auto}
.lenis.lenis-smooth{scroll-behavior:auto!important}
.lenis.lenis-stopped{overflow:hidden}
html.is-loading,html.is-loading body{overflow:hidden}
body{
  margin:0;background:var(--bg);color:var(--fg);
  font-family:"Inter","Inter Display","Neue Montreal","Helvetica Neue",Helvetica,Arial,sans-serif;
  font-weight:300;font-optical-sizing:auto;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
  text-rendering:optimizeLegibility;overflow-x:hidden;
}
::selection{background:rgba(237,234,228,.85);color:#1a1216}
.no-gl body{background:linear-gradient(to top,#b86c4f 0%,#5a2f43 26%,#1d1528 58%,#07080e 100%) fixed}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:0}
.no-gl #gl{display:none}
a{color:inherit;text-decoration:none}
a:focus-visible,button:focus-visible{outline:none;text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:.14em}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* line masks */
.line{display:block;overflow:hidden;padding:0 .1em .14em 0;margin:0 -.1em -.14em 0}
.line-i{display:block;white-space:nowrap;will-change:transform}

/* loader */
#loader{
  position:fixed;inset:0;z-index:50;background:var(--bg);
  display:flex;align-items:flex-end;
  padding:calc(var(--pad) + env(safe-area-inset-top,0px)) calc(var(--pad) + env(safe-area-inset-right,0px)) calc(var(--pad) + env(safe-area-inset-bottom,0px)) calc(var(--pad) + env(safe-area-inset-left,0px));
}
.ld{display:flex;align-items:flex-start;font-weight:200;letter-spacing:-.05em;line-height:1;font-variant-numeric:tabular-nums;font-variation-settings:"opsz" 32}
.ld .line{display:inline-block}
#ldNum{font-size:clamp(3.5rem,11vw,10rem)}
#ldPct{font-size:clamp(1rem,2.2vw,1.8rem);letter-spacing:0;margin-left:.35em;margin-top:.5em}

/* header */
.hd{
  position:fixed;top:0;left:0;right:0;z-index:10;
  display:flex;justify-content:space-between;align-items:flex-start;
  padding:calc(var(--pad) + env(safe-area-inset-top,0px)) calc(var(--pad) + env(safe-area-inset-right,0px)) 0 calc(var(--pad) + env(safe-area-inset-left,0px));
  font-size:clamp(.92rem,1vw,1.05rem);letter-spacing:-.01em;font-weight:400;pointer-events:none;
}
.hd a{pointer-events:auto;transition:opacity .9s var(--ease)}
.hd a:hover{opacity:.6}
html.is-loading .hd,html.is-loading #app{visibility:hidden}

#app{position:relative;z-index:1}
.view:focus{outline:none}

/* home */
.home{padding:34vh calc(var(--pad) + env(safe-area-inset-right,0px)) 32vh calc(var(--pad) + env(safe-area-inset-left,0px))}
.plist{list-style:none;margin:0;padding:0}
.plist li{display:block}
.p{
  display:inline-flex;align-items:flex-start;gap:clamp(.5rem,1.1vw,1.2rem);
  padding:.05em 0;transition:opacity 1.2s var(--ease);
}
.p-num{
  font-size:clamp(.68rem,.78vw,.85rem);font-weight:200;letter-spacing:.02em;
  font-variant-numeric:tabular-nums;min-width:1.7em;padding-top:clamp(.45rem,1.35vw,1.5rem);
}
.p-title{
  font-size:clamp(2.6rem,7.1vw,8.6rem);line-height:.97;letter-spacing:-.047em;font-weight:300;
  font-variation-settings:"opsz" 32;
}
.plist.is-hover .p{opacity:.14}
.plist.is-hover .p.is-active{opacity:1}

/* about */
.about{padding:30vh calc(var(--pad) + env(safe-area-inset-right,0px)) 22vh calc(var(--pad) + env(safe-area-inset-left,0px));max-width:52rem}
.bio{margin:0 0 clamp(3.5rem,10vh,7rem);font-size:clamp(1.45rem,2.45vw,2.45rem);line-height:1.17;letter-spacing:-.028em;font-variation-settings:"opsz" 32;max-width:21em}
.awards{list-style:none;margin:0 0 clamp(3.5rem,10vh,7rem);padding:0;font-size:clamp(.95rem,1.05vw,1.12rem);letter-spacing:-.01em}
.awards li{display:grid;grid-template-columns:4.2em 1fr;padding:.32em 0}
.aw-q{font-weight:200;font-variant-numeric:tabular-nums}
.copy{appearance:none;background:none;border:0;padding:0;margin:0;color:var(--fg);font:inherit;font-weight:400;font-size:clamp(1rem,1.2vw,1.25rem);letter-spacing:-.01em;cursor:pointer}
.copy-mask{display:inline-grid;overflow:hidden;vertical-align:top;padding-bottom:.1em;margin-bottom:-.1em}
.copy-mask>span{grid-area:1/1;white-space:nowrap}
.copy .ch{display:inline-block;white-space:pre}
.copy-b{user-select:text}

/* project */
.project{padding:26vh calc(var(--pad) + env(safe-area-inset-right,0px)) 20vh calc(var(--pad) + env(safe-area-inset-left,0px))}
.pj-num{display:block;font-size:clamp(.72rem,.8vw,.86rem);font-weight:200;font-variant-numeric:tabular-nums;margin-bottom:1.3rem}
.pj-title{margin:0 0 clamp(2.5rem,8vh,5.5rem);font-weight:300;font-size:clamp(3rem,9.2vw,10.5rem);line-height:.95;letter-spacing:-.052em;font-variation-settings:"opsz" 32;max-width:9.5em}
.pj-grid{display:grid;grid-template-columns:minmax(9rem,16rem) minmax(0,33rem);gap:clamp(2rem,6vw,7rem);margin-bottom:clamp(5rem,16vh,11rem)}
.pj-meta{margin:0;display:grid;gap:1.15rem;align-content:start;font-size:clamp(.88rem,.95vw,1rem)}
.pj-meta dt{font-size:.78em;color:var(--fg-soft);margin-bottom:.2rem}
.pj-meta dd{margin:0}
.pj-desc{margin:0;font-size:clamp(1.08rem,1.38vw,1.4rem);line-height:1.42;letter-spacing:-.012em;max-width:31em}
.pj-desc .line-i{white-space:nowrap}
.pj-visual{width:min(64vw,1000px);aspect-ratio:16/10;margin:0 0 clamp(6rem,20vh,14rem) auto}
.pj-visual img{display:block;width:100%;height:100%;object-fit:cover}
.pj-next{display:inline-block}
.pj-next-label{display:block;font-size:clamp(.78rem,.85vw,.9rem);color:var(--fg-soft);margin-bottom:.9rem}
.pj-next-title{display:block;font-size:clamp(2.4rem,6.6vw,7.4rem);line-height:.97;letter-spacing:-.047em;font-variation-settings:"opsz" 32}

@media (max-width:767px){
  .home{padding-top:26vh;padding-bottom:26vh}
  .p{display:flex;width:100%}
  .p-title{font-size:clamp(2.3rem,12.4vw,4.6rem)}
  .plist.m .p{opacity:.3}
  .plist.m .p.is-active{opacity:1}
  .pj-grid{grid-template-columns:1fr}
  .pj-visual{width:100%}
  .about{padding-top:24vh}
}
</style>
</head>

      text:'An aurora shown on a planetarium dome and in the browser from the same code. The sky follows the solar wind recorded the night before.' },
    { slug:'tessiture', title:'Tessiture', year:'2022', role:'Creative development, audio', client:'Tessiture Records', color:'#D98BB8', visual:'grid',
      text:'A record label where each release has a surface you can play with the cursor. The shaders listen to the actual stems of every track.' },

  ]

const P = CONFIG.projects;

/* ================================================================
   Utilities
   ================================================================ */
const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
const pad = n => String(n).padStart(2, '0');
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const wait = ms => new Promise(r => setTimeout(r, ms));
const nextFrame = () => new Promise(r => requestAnimationFrame(() => r()));
const damp = (a, b, l, dt) => a + (b - a) * (1 - Math.exp(-l * dt));
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const coarse = matchMedia('(pointer: coarse)').matches;
const isNarrow = () => innerWidth < 768;
const LOW = isNarrow() || coarse;
const canHover = () => matchMedia('(hover: hover) and (pointer: fine)').matches && !isNarrow();
const EO = 'expo.out';

const S = {
  route: null, view: null, busy: false, pending: null, started: false,
  mouse: { x: innerWidth * .5, y: innerHeight * .5, nx: 0, ny: 0 },
  cam: { pos: { x: 0, y: 1.4, z: 16 }, target: { x: 0, y: 2.1, z: 0 } },
  scrollP: 0, lastSy: 0, scrollVel: 0, hoverTimer: null, mActive: -1, observer: null,
  img: { mode: 'none', el: null, idx: -1, x: 0, y: 0, px: 0, py: 0, vx: 0, vy: 0, w: 300, h: 375, mixTween: null }
};
let gl = null, lenis = null;
const visuals = [];

/* ================================================================
   Project key visuals (generated — swap for real screenshots)
   ================================================================ */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const hexRgb = h => { const n = parseInt(h.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; };
const mixRgb = (a, b, t) => a.map((v, i) => Math.round(v + (b[i] - v) * t));
const rgba = (c, a) => 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + (a === undefined ? 1 : a) + ')';

function drawVisual(p, i){
  const W = 480, H = 600;
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const x = c.getContext('2d');
  const R = mulberry32(1337 + i * 7919);
  const base = hexRgb(p.color), ink = [9, 8, 11], white = [246, 242, 235];
  const dark = mixRgb(base, ink, .86), mid = mixRgb(base, ink, .56), lite = mixRgb(base, white, .42);
  let g = x.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, rgba(dark)); g.addColorStop(1, rgba(mid));
  x.fillStyle = g; x.fillRect(0, 0, W, H);
  x.lineWidth = 1;
  switch (p.visual){
    case 'waves': {
      const n = 54;
      for (let k = 0; k < n; k++){
        const t = k / (n - 1), y0 = 90 + t * 440, amp = 6 + 24 * Math.sin(t * Math.PI), ph = R() * 6.28, fr = .011 + R() * .006;
        x.beginPath();
        for (let X = 0; X <= W; X += 6){
          const y = y0 + Math.sin(X * fr + ph) * amp * Math.sin(X / W * Math.PI);
          if (X === 0) x.moveTo(X, y); else x.lineTo(X, y);
        }
        x.strokeStyle = rgba(mixRgb(base, white, t * .5), .14 + .56 * t); x.stroke();
      }
      break;
    }
    case 'orb': {
      const cx = W * (.4 + R() * .2), cy = H * .5, r = 145 + R() * 30;
      const halo = x.createRadialGradient(cx, cy, r * .7, cx, cy, r * 2.3);
      halo.addColorStop(0, rgba(base, .28)); halo.addColorStop(1, rgba(base, 0));
      x.fillStyle = halo; x.fillRect(0, 0, W, H);
      const rg = x.createRadialGradient(cx, cy - r * .35, r * .1, cx, cy, r);
      rg.addColorStop(0, rgba(lite)); rg.addColorStop(.6, rgba(base)); rg.addColorStop(1, rgba(mid, .2));
      x.fillStyle = rg; x.beginPath(); x.arc(cx, cy, r, 0, Math.PI * 2); x.fill();
      x.fillStyle = rgba(dark, .92); x.fillRect(0, H * .72, W, H * .28);
      x.fillStyle = rgba(lite, .55); x.fillRect(0, Math.round(H * .72), W, 1);
      break;
    }
    case 'rings': {
      const cx = W * .5, cy = H * .46;
      for (let k = 0; k < 28; k++){
        const r = 12 + k * k * .55;
        x.beginPath(); x.ellipse(cx + (R() - .5) * 6, cy, r, r * .92, 0, 0, Math.PI * 2);
        x.strokeStyle = rgba(mixRgb(lite, base, k / 28), .72 - k / 28 * .6); x.stroke();
      }
      const rg = x.createRadialGradient(cx, cy, 0, cx, cy, 80);
      rg.addColorStop(0, rgba(lite, .9)); rg.addColorStop(1, rgba(base, 0));
      x.fillStyle = rg; x.fillRect(0, 0, W, H);
      break;
    }
    case 'arches': {
      const n = 6, floor = H - 70;
      for (let k = n - 1; k >= 0; k--){
        const w = 90 + k * 52, h = 200 + k * 56, x0 = (W - w) / 2, y0 = floor - h, t = k / (n - 1);
        x.beginPath(); x.moveTo(x0, floor); x.lineTo(x0, y0 + w / 2);
        x.arc(W / 2, y0 + w / 2, w / 2, Math.PI, 0); x.lineTo(x0 + w, floor); x.closePath();
        const gg = x.createLinearGradient(0, y0, 0, floor);
        gg.addColorStop(0, rgba(mixRgb(lite, base, t))); gg.addColorStop(1, rgba(mixRgb(base, dark, t * .8 + .2)));
        x.fillStyle = gg; x.fill();
      }
      x.fillStyle = rgba(dark); x.fillRect(0, floor, W, 70);
      break;
    }
    case 'strata': {
      let y = 30;
      while (y < H + 40){
        const h = 14 + R() * 64, tone = R(), col = tone < .33 ? lite : (tone < .66 ? base : mid);
        x.beginPath(); x.moveTo(0, y);
        for (let X = 0; X <= W; X += 12) x.lineTo(X, y + Math.sin(X * .013 + y * .02) * 6);
        x.lineTo(W, y + h + 10); x.lineTo(0, y + h + 10); x.closePath();
        x.fillStyle = rgba(col, .32 + R() * .5); x.fill();
        y += h;
      }
      break;
    }
    default: { // grid
      x.strokeStyle = rgba(lite, .09);
      for (let X = 0; X <= W; X += 24){ x.beginPath(); x.moveTo(X + .5, 0); x.lineTo(X + .5, H); x.stroke(); }
      for (let Y = 0; Y <= H; Y += 24){ x.beginPath(); x.moveTo(0, Y + .5); x.lineTo(W, Y + .5); x.stroke(); }
      const bx = 48 + Math.floor(R() * 4) * 24, by = 96 + Math.floor(R() * 5) * 24;
      const bw = 24 * (6 + Math.floor(R() * 4)), bh = 24 * (8 + Math.floor(R() * 5));
      const gg = x.createLinearGradient(bx, by, bx + bw, by + bh);
      gg.addColorStop(0, rgba(lite)); gg.addColorStop(1, rgba(base));
      x.fillStyle = gg; x.fillRect(bx, by, bw, bh);
      for (let k = 0; k < 5; k++){ x.fillStyle = rgba(lite, .45 + R() * .4); x.fillRect(24 * Math.floor(R() * 19), 24 * Math.floor(R() * 24), 24, 24); }
    }
  }
  const v = x.createRadialGradient(W / 2, H / 2, H * .25, W / 2, H / 2, H * .78);
  v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,.38)');
  x.fillStyle = v; x.fillRect(0, 0, W, H);
  return c;
}

/* ================================================================
   GLSL
   ================================================================ */
const GLSL_COMMON = `
uniform float uTime; uniform vec3 uLightColor; uniform float uIntensity;
uniform vec3 uSunDir; uniform vec3 uCamPos; uniform float uMist; uniform vec3 uLightDir;
`;
const GLSL_NOISE = `
vec3 mod289(vec3 x){return x-floor(x*(1.0/289.0))*289.0;}
vec4 mod289(vec4 x){return x-floor(x*(1.0/289.0))*289.0;}
vec4 permute(vec4 x){return mod289(((x*34.0)+1.0)*x);}
vec4 taylorInvSqrt(vec4 r){return 1.79284291400159-0.85373472095314*r;}
float snoise(vec3 v){
  const vec2 C=vec2(1.0/6.0,1.0/3.0);
  const vec4 D=vec4(0.0,0.5,1.0,2.0);
  vec3 i=floor(v+dot(v,C.yyy));
  vec3 x0=v-i+dot(i,C.xxx);
  vec3 g=step(x0.yzx,x0.xyz);
  vec3 l=1.0-g;
  vec3 i1=min(g.xyz,l.zxy);
  vec3 i2=max(g.xyz,l.zxy);
  vec3 x1=x0-i1+C.xxx;
  vec3 x2=x0-i2+C.yyy;
  vec3 x3=x0-D.yyy;
  i=mod289(i);
  vec4 p=permute(permute(permute(i.z+vec4(0.0,i1.z,i2.z,1.0))+i.y+vec4(0.0,i1.y,i2.y,1.0))+i.x+vec4(0.0,i1.x,i2.x,1.0));
  float n_=0.142857142857;
  vec3 ns=n_*D.wyz-D.xzx;
  vec4 j=p-49.0*floor(p*ns.z*ns.z);
  vec4 x_=floor(j*ns.z);
  vec4 y_=floor(j-7.0*x_);
  vec4 x=x_*ns.x+ns.yyyy;
  vec4 y=y_*ns.x+ns.yyyy;
  vec4 h=1.0-abs(x)-abs(y);
  vec4 b0=vec4(x.xy,y.xy);
  vec4 b1=vec4(x.zw,y.zw);
  vec4 s0=floor(b0)*2.0+1.0;
  vec4 s1=floor(b1)*2.0+1.0;
  vec4 sh=-step(h,vec4(0.0));
  vec4 a0=b0.xzyw+s0.xzyw*sh.xxyy;
  vec4 a1=b1.xzyw+s1.xzyw*sh.zzww;
  vec3 p0=vec3(a0.xy,h.x);
  vec3 p1=vec3(a0.zw,h.y);
  vec3 p2=vec3(a1.xy,h.z);
  vec3 p3=vec3(a1.zw,h.w);
  vec4 norm=taylorInvSqrt(vec4(dot(p0,p0),dot(p1,p1),dot(p2,p2),dot(p3,p3)));

  vec4 m=max(0.6-vec4(dot(x0,x0),dot(x1,x1),dot(x2,x2),dot(x3,x3)),0.0);
  m=m*m;
  return 42.0*dot(m*m,vec4(dot(p0,x0),dot(p1,x1),dot(p2,x2),dot(p3,x3)));

vec3 skyColor(vec3 d){

uniform vec3 uCamObj; uniform vec3 uLightObj; uniform vec3 uHalf; uniform float uGain;

const VS_UV = `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`;
const FS_HALO = GLSL_COMMON + `
varying vec2 vUv;
void main(){

const VS_CARD = `varying vec2 vUv; varying vec3 vWorld; void main(){ vUv = uv; vec4 w = modelMatrix * vec4(position, 1.0); vWorld = w.xyz; gl_Position = projectionMatrix * viewMatrix * w; }`;
const FS_CARD = PRE + `
uniform float uSeed; varying vec2 vUv; varying vec3 vWorld;
void main(){

const VS_POST = `varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }`;
const FS_POST = GLSL_COMMON + GLSL_NOISE + `
uniform sampler2D tScene; uniform vec2 uRes; uniform float uGrain; uniform float uExposure;

vec3 aces(vec3 x){ return clamp((x * (2.51 * x + 0.03)) / (x * (2.43 * x + 0.59) + 0.14), 0.0, 1.0); }

  gl_FragColor = vec4(col, 1.0);
}`;

/* ================================================================
   WebGL scene
   ================================================================ */
function createGL(canvases){
  if (!window.THREE) return null;
  const canvas = $('#gl');
  let renderer;
  try {
    renderer = new THREE.WebGLRenderer({ canvas, antialias: false, alpha: false, stencil: false, powerPreference: 'high-performance' });
  } catch (e) { return null; }
  if (!renderer || !renderer.getContext()) return null;

  const isGL2 = renderer.capabilities.isWebGL2;
  const floatRT = isGL2 && renderer.extensions.has('EXT_color_buffer_float');
  const maxDpr = LOW ? 1.25 : 1.5;
  const maxPix = LOW ? 520000 : 2100000;
  let pr = Math.min(window.devicePixelRatio || 1, maxDpr);
  let scale = 1, W = innerWidth, H = innerHeight, ft = 16, fc = 0, sp = .5;
  renderer.setPixelRatio(pr);
  renderer.setClearColor(0x09080b, 1);

  const U = {
    uTime: { value: 0 }, uLightColor: { value: new THREE.Color(1, .6, .35) }, uIntensity: { value: 0 },
    uSunDir: { value: new THREE.Vector3(0, .06, -1).normalize() }, uCamPos: { value: new THREE.Vector3() },
    uMist: { value: 1 }, uLightDir: { value: new THREE.Vector3(0, .34, -1).normalize() }
  };
  const lightTarget = new THREE.Color(1, .6, .35);
  const L = new THREE.Vector3();
  const par = { x: 0, y: 0 };

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(35, 1, .1, 220);

  // Sky
  const sky = new THREE.Mesh(new THREE.SphereGeometry(80, 48, 24),
    new THREE.ShaderMaterial({ uniforms: U, vertexShader: VS_SKY, fragmentShader: FS_SKY, side: THREE.BackSide, depthWrite: false }));
  sky.renderOrder = -1; sky.frustumCulled = false; scene.add(sky);

  // Ground
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(160, 160),
    new THREE.ShaderMaterial({ uniforms: U, vertexShader: VS_WORLD, fragmentShader: FS_GROUND }));
  ground.rotation.x = -Math.PI / 2; scene.add(ground);

  // Monolith
  const HALF = new THREE.Vector3(.72, 2.15, .3);
  const stoneU = Object.assign({
    uCamObj: { value: new THREE.Vector3() }, uLightObj: { value: new THREE.Vector3() },
    uHalf: { value: HALF }, uGain: { value: 1.55 }
  }, U);
  const stone = new THREE.Mesh(new THREE.BoxGeometry(HALF.x * 2, HALF.y * 2, HALF.z * 2),
    new THREE.ShaderMaterial({ uniforms: stoneU, vertexShader: VS_STONE, fragmentShader: FS_STONE, defines: { STEPS: LOW ? 10 : 24 } }));
  stone.position.set(0, HALF.y, 0); stone.rotation.set(0, .38, .012);
  scene.add(stone);
  stone.updateMatrixWorld(true);
  const stoneInv = new THREE.Matrix4().copy(stone.matrixWorld).invert();

  // Backlight halo
  const halo = new THREE.Mesh(new THREE.PlaneGeometry(10, 10),
    new THREE.ShaderMaterial({ uniforms: U, vertexShader: VS_UV, fragmentShader: FS_HALO, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending }));
  const haloBase = new THREE.Vector3(0, 2.3, 0);
  scene.add(halo);

  // Ground mist sheets
  const cards = [];
  const cardDefs = LOW
    ? [[-3.0, .7, 2.2, .3], [1.2, .85, -2.4, 3.1]]
    : [[-3.2, .7, 2.4, .3], [3.6, .6, 1.2, 1.7], [.4, .85, -2.4, 3.1], [-5.5, .6, -1.4, 4.4], [5.2, .9, -3.6, 5.9]];
  cardDefs.forEach(d => {
    const m = new THREE.Mesh(new THREE.PlaneGeometry(11, 2.4),
      new THREE.ShaderMaterial({ uniforms: Object.assign({ uSeed: { value: d[3] } }, U), vertexShader: VS_CARD, fragmentShader: FS_CARD, transparent: true, depthWrite: false }));
    m.position.set(d[0], d[1], d[2]); scene.add(m); cards.push(m);
  });

    type: floatRT ? THREE.HalfFloatType : THREE.UnsignedByteType, format: THREE.RGBAFormat,
    minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter, depthBuffer: true, stencilBuffer: false
  });
  const tex = canvases.map(c => {
    const t = new THREE.CanvasTexture(c);
    t.minFilter = THREE.LinearFilter; t.magFilter = THREE.LinearFilter; t.generateMipmaps = false;
    t.wrapS = t.wrapT = THREE.ClampToEdgeWrapping; return t;
  });
  const postU = {
    tScene: { value: rt.texture }, uRes: { value: new THREE.Vector2(1, 1) }, uTime: U.uTime,
    uGrain: { value: LOW ? .05 : .06 }, uExposure: { value: 1 },
    uImgA: { value: tex[0] }, uImgB: { value: tex[0] }, uImgMix: { value: 0 }, uReveal: { value: 0 }, uWobble: { value: 0 },
    uImgPos: { value: new THREE.Vector2() }, uImgSize: { value: new THREE.Vector2(1, 1) }, uImgVel: { value: new THREE.Vector2() },
    uRectAspect: { value: .8 }, uReduced: { value: reduced ? 1 : 0 }

  const postScene = new THREE.Scene();
  const postCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
  const quad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2),
    new THREE.ShaderMaterial({ uniforms: postU, vertexShader: VS_POST, fragmentShader: FS_POST, depthTest: false, depthWrite: false }));
  quad.frustumCulled = false; postScene.add(quad);

  function sizeRT(){
    const bw = W * pr, bh = H * pr;
    const s = Math.min(scale, Math.sqrt(maxPix / (bw * bh)), 1);
    rt.setSize(Math.max(2, Math.floor(bw * s)), Math.max(2, Math.floor(bh * s)));
  }
  function resize(){
    W = canvas.clientWidth || innerWidth; H = canvas.clientHeight || innerHeight;
    pr = Math.min(window.devicePixelRatio || 1, maxDpr);
    renderer.setPixelRatio(pr); renderer.setSize(W, H, false);
    const a = W / H;

  }

  function update(dt){
    const t = U.uTime.value = reduced ? 12 : U.uTime.value + dt;

    // camera: route position + slow drift + mouse parallax
    par.x = reduced ? 0 : damp(par.x, S.mouse.nx, 1.4, dt);
    par.y = reduced ? 0 : damp(par.y, S.mouse.ny, 1.4, dt);
    const cp = S.cam.pos, ct = S.cam.target;
    let dx = 0, dy = 0, dz = 0;
    if (!reduced){
      dx = Math.sin(t * .047) * .3 + Math.sin(t * .019 + 1.3) * .18;
      dy = Math.sin(t * .031) * .1;
      dz = Math.cos(t * .041) * .26;
    }
    camera.position.set(cp.x + dx + par.x * .45, cp.y + dy + par.y * .2, cp.z + dz);
    camera.lookAt(ct.x + par.x * .12, ct.y + par.y * .05, ct.z);
    U.uCamPos.value.copy(camera.position);

    // light: stays behind the stone, turns with scroll
    const az = Math.atan2(cp.x, cp.z);
    sp = reduced ? .5 : damp(sp, S.scrollP, 2, dt);
    const th = -az + (sp - .5) * 2.3 + (reduced ? 0 : Math.sin(t * .06) * .1);
    L.set(Math.sin(th), .34, -Math.cos(th)).normalize();
    U.uLightDir.value.copy(L);
    U.uSunDir.value.set(L.x, .05, L.z).normalize();
    U.uLightColor.value.lerp(lightTarget, 1 - Math.exp(-dt * (reduced ? 6 : 1.8)));

    stoneU.uCamObj.value.copy(camera.position).applyMatrix4(stoneInv);
    stoneU.uLightObj.value.copy(L).transformDirection(stoneInv);
    halo.position.set(L.x, 0, L.z).normalize().multiplyScalar(1.9).add(haloBase);

      const c = cards[i];
      c.rotation.y = Math.atan2(camera.position.x - c.position.x, camera.position.z - c.position.z);
    }

    // liquid image
    const I = S.img;
    if (I.mode !== 'none'){
      let tw = I.w, th2 = I.h;
      const idt = Math.max(dt, 1e-3);
      if (I.mode === 'cursor'){
        const flip = S.mouse.x + I.w * 1.2 > W;
        const tx = S.mouse.x + (flip ? -1 : 1) * I.w * .62, ty = S.mouse.y;
        if (reduced){ I.x = tx; I.y = ty; } else { I.x = damp(I.x, tx, 6.5, dt); I.y = damp(I.y, ty, 6.5, dt); }
        I.vx = damp(I.vx, (I.x - I.px) / idt, 10, dt);
        I.vy = damp(I.vy, (I.y - I.py) / idt, 10, dt);

        const r = I.el.getBoundingClientRect();
        I.x = r.left + r.width / 2; I.y = r.top + r.height / 2; tw = r.width; th2 = r.height;
        I.vx = 0; I.vy = damp(I.vy, -S.scrollVel * .8, 8, dt);
      }
      I.px = I.x; I.py = I.y;
      postU.uImgPos.value.set(I.x * pr, (H - I.y) * pr);
      postU.uImgSize.value.set(Math.max(1, tw * pr), Math.max(1, th2 * pr));
      postU.uImgVel.value.set(I.vx, -I.vy);
      postU.uRectAspect.value = tw / Math.max(1, th2);
    }

    // adaptive resolution to hold 60 fps
    if (dt > 0 && dt < .1){
      ft = ft * .94 + dt * 1000 * .06;
      if (++fc > 75){
        fc = 0;
        if (ft > 19.5 && scale > .5){ scale = Math.max(.5, scale - .1); sizeRT(); }
        else if (ft < 14 && scale < 1){ scale = Math.min(1, scale + .05); sizeRT(); }
      }
    }

    renderer.setRenderTarget(rt); renderer.render(scene, camera);
    renderer.setRenderTarget(null); renderer.render(postScene, postCam);
  }

  function killMix(){
    const I = S.img;
    if (I.mixTween){ I.mixTween.kill(); I.mixTween = null; }
    postU.uImgMix.value = 0;
  }

  return {
    U, canvas, update, resize,
    compile(){ renderer.compile(scene, camera); renderer.compile(postScene, postCam); },
    setLight(hex){ lightTarget.set(hex).convertSRGBToLinear(); },
    snapLight(hex){ lightTarget.set(hex).convertSRGBToLinear(); U.uLightColor.value.copy(lightTarget); },
    showCursorImage(i){
      const I = S.img;
      const hidden = I.mode !== 'cursor' || postU.uReveal.value < .05;
      I.mode = 'cursor'; I.el = null;
      if (hidden){
        killMix(); postU.uImgA.value = tex[i]; I.idx = i;
        I.x = I.px = S.mouse.x + I.w * .62; I.y = I.py = S.mouse.y; I.vx = I.vy = 0;
        gsap.to(postU.uReveal, { value: 1, duration: reduced ? .6 : 1.3, ease: reduced ? 'power1.out' : EO, overwrite: true });
      } else if (i !== I.idx){
        if (I.mixTween){ I.mixTween.kill(); I.mixTween = null; if (postU.uImgMix.value > .5) postU.uImgA.value = postU.uImgB.value; }
        postU.uImgB.value = tex[i]; postU.uImgMix.value = 0; I.idx = i;
        I.mixTween = gsap.to(postU.uImgMix, { value: 1, duration: .7, ease: 'power2.out', onComplete(){
          postU.uImgA.value = postU.uImgB.value; postU.uImgMix.value = 0; I.mixTween = null; } });
        if (!reduced) gsap.fromTo(postU.uWobble, { value: 1 }, { value: 0, duration: 1.2, ease: EO, overwrite: true });
        gsap.to(postU.uReveal, { value: 1, duration: .8, ease: EO, overwrite: true });
      }
    },
    showDomImage(el, i){
      const I = S.img;
      killMix(); I.mode = 'dom'; I.el = el; I.idx = i; I.vy = 0;
      postU.uImgA.value = tex[i];
      gsap.fromTo(postU.uReveal, { value: 0 }, { value: 1, duration: reduced ? .9 : 2, ease: reduced ? 'power1.out' : EO, overwrite: true });
    },
    hideImage(d){
      gsap.to(postU.uReveal, { value: 0, duration: d || .9, ease: reduced ? 'power1.out' : EO, overwrite: true,
        onComplete(){ S.img.mode = 'none'; S.img.el = null; S.img.idx = -1; } });
    }
  };
}

/* ================================================================
   Text: line splitting & reveals
   ================================================================ */
function splitLines(el){
  const text = el.dataset.text || el.textContent.trim().replace(/\s+/g, ' ');
  el.dataset.text = text;
  el.textContent = '';
  const words = text.split(' ');
  const spans = words.map((w, i) => {
    const s = document.createElement('span'); s.textContent = w; el.appendChild(s);
    if (i < words.length - 1) el.appendChild(document.createTextNode(' '));
    return s;
  });
  const lines = []; let top = null;
  spans.forEach(s => {
    const t = s.offsetTop;
    if (top === null || Math.abs(t - top) > 2){ lines.push([]); top = t; }
    lines[lines.length - 1].push(s.textContent);
  });
  el.textContent = '';
  lines.forEach(l => {
    const o = document.createElement('span'); o.className = 'line';
    const i = document.createElement('span'); i.className = 'line-i'; i.textContent = l.join(' ');
    o.appendChild(i); el.appendChild(o);
  });
}

function prepareView(view){
  view.style.visibility = 'hidden';
  $$('[data-split]', view).forEach(splitLines);
  if (reduced) $$('[data-group]', view).forEach(g => { g.style.opacity = 0; });
  else {
    gsap.set($$('.line-i', view), { yPercent: 110 });
    if (!gl) $$('[data-visual]', view).forEach(v => { v.style.opacity = 0; });
  }
  view.style.visibility = '';
}

function revealGroup(g, delay){
  if (g.dataset.revealed) return;
  g.dataset.revealed = '1';
  if (reduced) gsap.to(g, { opacity: 1, duration: .9, ease: 'power1.out', delay });
  else {
    const lines = $$('.line-i', g);
    if (lines.length) gsap.to(lines, { yPercent: 0, duration: 1.6, ease: EO, stagger: .075, delay });
  }
  if (g.hasAttribute('data-visual')){
    if (gl) setTimeout(() => { if (S.view && S.view.contains(g) && S.route && S.route.name === 'project') gl.showDomImage(g, S.route.index); }, delay * 1000);
    else if (!reduced) gsap.to(g, { opacity: 1, duration: 1.4, ease: EO, delay });
  }
}

function enterView(view){
  if (S.observer) S.observer.disconnect();
  S.observer = new IntersectionObserver(entries => {
    let k = 0;
    entries.forEach(en => {
      if (en.isIntersecting){ revealGroup(en.target, k * .07); k++; S.observer.unobserve(en.target); }
    });
  }, { rootMargin: '0px 0px -6% 0px', threshold: .01 });
  $$('[data-group]', view).forEach(g => S.observer.observe(g));
}

function animateOut(view){
  if (S.observer){ S.observer.disconnect(); S.observer = null; }
  return new Promise(res => {
    if (reduced){ gsap.to(view, { opacity: 0, duration: .45, ease: 'power1.out', onComplete: res }); return; }
    const lines = $$('.line-i', view).filter(l => { const r = l.getBoundingClientRect(); return r.bottom > -40 && r.top < innerHeight + 40; });
    if (!gl) $$('[data-visual]', view).forEach(v => gsap.to(v, { opacity: 0, duration: .5 }));
    if (!lines.length){ res(); return; }
    gsap.to(lines, { yPercent: -110, duration: .75, ease: 'power3.in', stagger: { amount: .18 }, overwrite: true, onComplete: res });
  });
}

function resplit(){
  if (!S.view) return;
  $$('[data-split]', S.view).forEach(splitLines);
  if (reduced) return;
  $$('[data-group]', S.view).forEach(g => {
    gsap.set($$('.line-i', g), { yPercent: g.dataset.revealed ? 0 : 110 });
  });
}

/* ================================================================
   Views
   ================================================================ */
function parse(h){
  h = (h || '').replace(/^#\/?/, '');
  if (h === 'about') return { name: 'about' };
  const m = h.match(/^work\/([\w-]+)/);
  if (m){ const i = P.findIndex(p => p.slug === m[1]); if (i >= 0) return { name: 'project', index: i }; }
  return { name: 'home' };
}
const sameRoute = (a, b) => a && b && a.name === b.name && a.index === b.index;
const routeColor = r => r.name === 'home' ? CONFIG.homeColor : r.name === 'about' ? CONFIG.aboutColor : P[r.index].color;
const titleFor = r => r.name === 'home' ? CONFIG.name + ' — ' + CONFIG.role
  : r.name === 'about' ? 'About — ' + CONFIG.name : P[r.index].title + ' — ' + CONFIG.name;
const maskLine = t => '<span class="line"><span class="line-i">' + esc(t) + '</span></span>';

function build(r){
  const s = document.createElement('section');
  s.tabIndex = -1;
  if (r.name === 'home'){
    s.className = 'view home';
    s.innerHTML = '<h1 class="sr">' + esc(CONFIG.name) + ', ' + esc(CONFIG.role) + '</h1><ol class="plist">' +
      P.map((p, i) => '<li data-group><a class="p" href="#/work/' + p.slug + '" data-i="' + i + '"><span class="p-num" aria-hidden="true">' +
        maskLine(pad(i + 1)) + '</span><span class="p-title" data-split>' + esc(p.title) + '</span></a></li>').join('') + '</ol>';
  } else if (r.name === 'about'){
    s.className = 'view about';
    s.innerHTML = '<h1 class="sr">About</h1><p class="bio" data-group data-split>' + esc(CONFIG.bio) + '</p>' +
      '<ul class="awards">' + CONFIG.awards.map(a => '<li data-group><span class="aw-q">' + maskLine(a[0] + 'x') +
        '</span><span class="aw-l" data-split>' + esc(a[1]) + '</span></li>').join('') + '</ul>' +
      '<div data-group><button class="copy" type="button"><span class="line"><span class="line-i"><span class="copy-mask">' +
      '<span class="copy-a">Copy email</span><span class="copy-b" aria-hidden="true">Copied</span></span></span></span></button></div>';
  } else {
    const i = r.index, p = P[i], ni = (i + 1) % P.length, n = P[ni];
    s.className = 'view project';
    s.innerHTML =
      '<header data-group><span class="pj-num">' + maskLine(pad(i + 1) + ' / ' + pad(P.length)) + '</span>' +
      '<h1 class="pj-title" data-split>' + esc(p.title) + '</h1></header>' +
      '<div class="pj-grid"><dl class="pj-meta" data-group>' +
        [['Year', p.year], ['Role', p.role], ['Client', p.client]].map(m => '<div><dt data-split>' + esc(m[0]) + '</dt><dd data-split>' + esc(m[1]) + '</dd></div>').join('') +
      '</dl><p class="pj-desc" data-group data-split>' + esc(p.text) + '</p></div>' +
      '<div class="pj-visual" data-group data-visual aria-hidden="true"></div>' +
      '<a class="pj-next" href="#/work/' + n.slug + '" data-group><span class="pj-next-label">' + maskLine('Next project, ' + pad(ni + 1)) +
      '</span><span class="pj-next-title" data-split>' + esc(n.title) + '</span></a>';
    if (!gl){
      const img = document.createElement('img');
      img.alt = ''; img.src = visuals[i].toDataURL('image/jpeg', .88);
      $('.pj-visual', s).appendChild(img);
    }
  }
  return s;
}

/* ---------- home interactions ---------- */
function bindHome(view){
  const list = $('.plist', view), items = $$('.p', view);
  if (!canHover()){ list.classList.add('m'); S.mActive = -1; updateMobileActive(); return; }
  const enter = i => {
    clearTimeout(S.hoverTimer);
    list.classList.add('is-hover');
    items.forEach((a, k) => a.classList.toggle('is-active', k === i));
    setLight(P[i].color);
    if (gl) gl.showCursorImage(i);
  };
  const leave = () => {
    list.classList.remove('is-hover');
    items.forEach(a => a.classList.remove('is-active'));
    if (S.route && S.route.name === 'home') setLight(CONFIG.homeColor);
    if (gl) gl.hideImage(.9);
  };
  items.forEach((a, i) => {
    a.addEventListener('mouseenter', () => enter(i));
    a.addEventListener('mouseleave', () => { clearTimeout(S.hoverTimer); S.hoverTimer = setTimeout(leave, 90); });
    a.addEventListener('focus', () => enter(i));
    a.addEventListener('blur', () => { clearTimeout(S.hoverTimer); S.hoverTimer = setTimeout(leave, 90); });
  });
}
function updateMobileActive(){
  if (!S.view || !S.route || S.route.name !== 'home') return;
  const list = $('.plist.m', S.view); if (!list) return;
  const items = $$('.p', list), mid = innerHeight * .5;
  let best = -1, bd = Infinity;
  items.forEach((el, i) => { const r = el.getBoundingClientRect(); const d = Math.abs(r.top + r.height / 2 - mid); if (d < bd){ bd = d; best = i; } });
  if (best === S.mActive) return;
  S.mActive = best;
  items.forEach((el, i) => el.classList.toggle('is-active', i === best));
  if (best >= 0) setLight(P[best].color);
}

/* ---------- about: copy email ---------- */
function charSpans(el, text){
  el.textContent = '';
  Array.from(text).forEach(ch => { const s = document.createElement('span'); s.className = 'ch'; s.textContent = ch; el.appendChild(s); });
  return $$('.ch', el);
}
function legacyCopy(text){
  try {
    const ta = document.createElement('textarea'); ta.value = text; ta.setAttribute('readonly', '');
    ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta); ta.select();
    const ok = document.execCommand('copy'); ta.remove(); return ok;
  } catch (e) { return false; }
}
function bindAbout(view){
  const btn = $('.copy', view); if (!btn) return;
  const a = $('.copy-a', btn), b = $('.copy-b', btn);
  let aCh = charSpans(a, 'Copy email');
  gsap.set(b, { yPercent: 110 });
  btn.addEventListener('click', async () => {
    let ok = false;
    try { await navigator.clipboard.writeText(CONFIG.email); ok = true; } catch (e) { ok = legacyCopy(CONFIG.email); }
    const bCh = charSpans(b, ok ? 'Copied' : CONFIG.email);
    b.removeAttribute('aria-hidden');
    $('#live').textContent = ok ? 'Email copied' : CONFIG.email;
    clearTimeout(btn._t);
    gsap.killTweensOf([a, b, aCh, bCh]);
    if (reduced){
      gsap.set(b, { yPercent: 0, opacity: 0 }); gsap.to(a, { opacity: 0, duration: .3 }); gsap.to(b, { opacity: 1, duration: .4 });
    } else {
      gsap.set(b, { yPercent: 0 }); gsap.set(a, { yPercent: 0 });
      gsap.to(aCh, { yPercent: -110, duration: .6, ease: EO, stagger: .018 });
      gsap.fromTo(bCh, { yPercent: 110 }, { yPercent: 0, duration: .9, ease: EO, stagger: .028, delay: .05 });
    }
    btn._t = setTimeout(() => {
      b.setAttribute('aria-hidden', 'true');
      if (reduced){ gsap.to(b, { opacity: 0, duration: .3 }); gsap.to(a, { opacity: 1, duration: .4 }); return; }
      gsap.to($$('.ch', b), { yPercent: -110, duration: .6, ease: EO, stagger: .015 });
      aCh = $$('.ch', a);
      gsap.fromTo(aCh, { yPercent: 110 }, { yPercent: 0, duration: .9, ease: EO, stagger: .02, delay: .08 });
    }, ok ? 2200 : 6000);
  });
}

/* ---------- project: next-link light preview ---------- */
function bindProject(view, r){
  const next = $('.pj-next', view); if (!next) return;
  const n = P[(r.index + 1) % P.length];
  next.addEventListener('mouseenter', () => setLight(n.color));
  next.addEventListener('mouseleave', () => { if (S.route && S.route.index === r.index) setLight(P[r.index].color); });
}

/* ================================================================
   Router, camera, light
   ================================================================ */
function setLight(hex){ if (gl) gl.setLight(hex); }

function camFor(r){
  const n = isNarrow(), C = { x: 0, y: 2.15, z: 0 };
  let pos, off;
  if (r.name === 'home'){ pos = n ? { x: 0, y: 2, z: 12.8 } : { x: .4, y: 1.75, z: 9.6 }; off = n ? 0 : 1.35; C.y = n ? 2.4 : 2.05; }
  else if (r.name === 'about'){ pos = n ? { x: -2.2, y: 1.2, z: 11.2 } : { x: 3.6, y: .95, z: 7 }; off = n ? 0 : 1.25; C.y = n ? 2.6 : 2.35; }
  else {
    const i = r.index, a = -1.05 + i * (2.1 / 11), rad = (n ? 11.5 : 7.4) - (i % 3) * .5;
    pos = { x: Math.sin(a) * rad, y: .9 + (i % 4) * .32, z: Math.cos(a) * rad };
    off = n ? 0 : 1.3; C.y = n ? 2.5 : 2.2;
  }
  const fx = C.x - pos.x, fz = C.z - pos.z, fl = Math.hypot(fx, fz) || 1;
  const rx = -fz / fl, rz = fx / fl;
  return { pos, target: { x: C.x - rx * off, y: C.y, z: C.z - rz * off } };
}

function moveCamera(r, intro){
  const c = camFor(r);
  const assign = () => { Object.assign(S.cam.pos, c.pos); Object.assign(S.cam.target, c.target); };
  if (reduced){
    if (gl && !intro){
      gsap.to(gl.canvas, { opacity: 0, duration: .35, ease: 'power1.out', onComplete(){ assign(); gsap.to(gl.canvas, { opacity: 1, duration: .6, ease: 'power1.out' }); } });
    } else assign();
    return;
  }
  if (intro){
    const p = c.pos, t = c.target;
    S.cam.pos.x = t.x + (p.x - t.x) * 1.7; S.cam.pos.y = p.y - .4; S.cam.pos.z = t.z + (p.z - t.z) * 1.7;
    Object.assign(S.cam.target, { x: t.x, y: t.y + .3, z: t.z });
  }
  const opts = { duration: intro ? 4.8 : 2.8, ease: intro ? EO : 'power3.inOut', overwrite: true };
  gsap.to(S.cam.pos, Object.assign({}, c.pos, opts));
  gsap.to(S.cam.target, Object.assign({}, c.target, opts));
}

function updateHeader(r){
  const lab = $('#aboutLabel'), link = $('.hd-about');
  const isAbout = r.name === 'about', txt = isAbout ? 'Index' : 'About';
  link.setAttribute('href', isAbout ? '#/' : '#/about');
  if (lab.textContent === txt) return;
  if (reduced || !S.view){ lab.textContent = txt; return; }
  gsap.to(lab, { yPercent: -110, duration: .45, ease: 'power3.in', onComplete(){
    lab.textContent = txt; gsap.fromTo(lab, { yPercent: 110 }, { yPercent: 0, duration: 1.1, ease: EO }); } });
}

async function go(route, intro){
  if (S.busy){ S.pending = route; return; }
  if (S.route && sameRoute(route, S.route)) return;
  S.busy = true;
  const prev = S.view;
  clearTimeout(S.hoverTimer);
  moveCamera(route, intro);
  setLight(routeColor(route));
  if (gl) gl.hideImage(.6);
  updateHeader(route);
  if (prev){ await animateOut(prev); prev.remove(); }
  if (lenis) lenis.scrollTo(0, { immediate: true, force: true });
  window.scrollTo(0, 0);
  S.route = route; S.mActive = -1;
  document.title = titleFor(route);
  const view = build(route);
  $('#app').appendChild(view); S.view = view;
  prepareView(view);
  if (route.name === 'home') bindHome(view);
  else if (route.name === 'about') bindAbout(view);
  else bindProject(view, route);
  if (lenis && lenis.resize) lenis.resize();
  if (!intro) view.focus({ preventScroll: true });
  await wait(intro ? 900 : (reduced ? 50 : 350));
  enterView(view);
  S.busy = false;
  if (S.pending){ const r = S.pending; S.pending = null; go(r); }
}

/* ================================================================
   Boot
   ================================================================ */
function tick(dt){
  const sy = lenis ? lenis.scroll : window.scrollY;
  const max = Math.max(1, document.documentElement.scrollHeight - innerHeight);
  S.scrollP = Math.min(1, Math.max(0, sy / max));
  if (dt > 0){ S.scrollVel = damp(S.scrollVel, (sy - S.lastSy) / Math.max(dt, 1e-3), 8, dt); }
  S.lastSy = sy;
  if (gl) gl.update(dt);
}

function start(){
  S.started = true;
  const ld = $('#loader');
  if (!reduced) gsap.to(['#ldNum', '#ldPct'], { yPercent: -110, duration: .8, ease: 'power3.in', stagger: .05 });
  gsap.to(ld, { opacity: 0, duration: reduced ? .6 : 1.4, delay: reduced ? 0 : .6, ease: 'power2.out', onComplete(){ ld.remove(); } });
  const hl = $$('.hd .line-i');
  if (!reduced) gsap.set(hl, { yPercent: 110 });
  document.documentElement.classList.remove('is-loading');
  if (lenis) lenis.start();
  if (gl) gsap.to(gl.U.uIntensity, { value: 1, duration: reduced ? .01 : 3.8, delay: reduced ? 0 : .4, ease: 'power2.out' });
  if (reduced) gsap.fromTo('.hd', { opacity: 0 }, { opacity: 1, duration: .8, ease: 'power1.out' });
  else gsap.to(hl, { yPercent: 0, duration: 1.6, ease: EO, stagger: .1, delay: 1.2 });
  go(parse(location.hash), true);
}

async function boot(){
  const t0 = performance.now();
  const num = $('#ldNum'), shown = { v: 0 };
  const prog = p => gsap.to(shown, { v: p, duration: .9, ease: EO, overwrite: true, onUpdate(){ num.textContent = Math.round(shown.v); } });

  if (!reduced && window.Lenis){
    lenis = new Lenis({ duration: 1.35, easing: t => Math.min(1, 1.001 - Math.pow(2, -10 * t)), smoothWheel: true, wheelMultiplier: .9, touchMultiplier: 1.4 });
    lenis.stop();
  }
  gsap.ticker.add((time, deltaMs) => { if (lenis) lenis.raf(time * 1000); tick(Math.min(deltaMs / 1000, .1)); });
  gsap.ticker.lagSmoothing(0);

  prog(6);
  try {
    if (document.fonts && document.fonts.load){
      await Promise.race([Promise.all([document.fonts.load('300 64px Inter'), document.fonts.load('200 16px Inter'), document.fonts.load('400 16px Inter')]).then(() => document.fonts.ready), wait(3000)]);
    }
  } catch (e) {}
  prog(22); await nextFrame();

  for (let i = 0; i < P.length; i++){
    visuals.push(drawVisual(P[i], i));
    if (i % 3 === 2){ prog(22 + Math.round((i + 1) / P.length * 38)); await nextFrame(); }
  }

  const first = parse(location.hash);
  const c = camFor(first);
  Object.assign(S.cam.pos, { x: c.pos.x * 1.7, y: c.pos.y - .4, z: c.pos.z * 1.7 });
  Object.assign(S.cam.target, c.target);

  try { gl = createGL(visuals); } catch (e) { console.warn(e); gl = null; }
  if (!gl) document.documentElement.classList.add('no-gl');
  prog(72); await nextFrame();

  if (gl){ gl.resize(); gl.snapLight(routeColor(first)); try { gl.compile(); } catch (e) {} }
  prog(90); await nextFrame();
  if (gl) gl.update(.016);
  await nextFrame();
  prog(100);
  await wait(Math.max(1000, 1900 - (performance.now() - t0)));
  start();
}

/* ---------- global listeners ---------- */
window.addEventListener('pointermove', e => {
  S.mouse.x = e.clientX; S.mouse.y = e.clientY;
  if (e.pointerType === 'mouse' || e.pointerType === 'pen'){
    S.mouse.nx = e.clientX / innerWidth * 2 - 1;
    S.mouse.ny = -(e.clientY / innerHeight * 2 - 1);
  }
}, { passive: true });
window.addEventListener('scroll', updateMobileActive, { passive: true });
window.addEventListener('hashchange', () => { if (S.started) go(parse(location.hash)); });

let lastW = innerWidth, rsT = null, lastNarrow = isNarrow();
window.addEventListener('resize', () => {
  if (gl) gl.resize();
  clearTimeout(rsT);
  rsT = setTimeout(() => {
    if (innerWidth === lastW) return;
    lastW = innerWidth; resplit();
    if (S.route){
      const nw = isNarrow();
      if (nw !== lastNarrow){ lastNarrow = nw; const r = S.route; S.route = null; S.view && S.view.remove(); S.view = null; go(r); return; }
      const c = camFor(S.route);
      if (reduced){ Object.assign(S.cam.pos, c.pos); Object.assign(S.cam.target, c.target); }
      else { gsap.to(S.cam.pos, Object.assign({}, c.pos, { duration: 1.4, ease: EO, overwrite: true })); gsap.to(S.cam.target, Object.assign({}, c.target, { duration: 1.4, ease: EO, overwrite: true })); }
    }
    updateMobileActive();
  }, 180);
});

if (!window.gsap){
  document.documentElement.classList.remove('is-loading');
  $('#loader').remove();
  document.documentElement.classList.add('no-gl');
  $('#app').innerHTML = '<p style="padding:30vh var(--pad)">The page could not load its animation library. Reload to try again.</p>';
  return;
}
boot();
})();
</script>
